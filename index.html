<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tableau Hyperliquid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap">
<style>
/* Layout : poste de suivi — bandeau d'état, synthèse chiffrée, puis tables de détail empilées */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --panel-2:#eceeeb; --line:#d9ddd8;
  --fg:#1b2420; --muted:#5f6b65; --accent:#b8661c; --accent-soft:#f3e3d2;
  --up:#1d7a4d; --up-soft:#dcefe4; --down:#c0392b; --down-soft:#f6dfdb;
  --warn:#a86a00; --warn-soft:#fbecc9;
  --f-display:"Archivo",system-ui,sans-serif;
  --f-body:"Inter Tight",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --panel:#18201c; --panel-2:#1f2924; --line:#2c3832;
  --fg:#e5ebe7; --muted:#8e9c95; --accent:#e7974d; --accent-soft:#3a2a1b;
  --up:#4cc38a; --up-soft:#173326; --down:#f0705f; --down-soft:#3a1f1b;
  --warn:#f0b54a; --warn-soft:#3a2e15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --panel:#18201c; --panel-2:#1f2924; --line:#2c3832;
  --fg:#e5ebe7; --muted:#8e9c95; --accent:#e7974d; --accent-soft:#3a2a1b;
  --up:#4cc38a; --up-soft:#173326; --down:#f0705f; --down-soft:#3a1f1b;
  --warn:#f0b54a; --warn-soft:#3a2e15; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--fg);padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:0;font:800 clamp(26px,5vw,38px)/1 var(--f-display);letter-spacing:-.02em}
.brand .addr{font:500 12px/1.4 var(--f-mono);color:var(--muted);word-break:break-all}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stamp{font:500 12px var(--f-mono);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:6px;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}

#settings{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
#settings input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:var(--f-mono);font-size:13px;min-width:0}
#settings .full{grid-column:1/-1}
#settings .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}

#alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:6px;border-left:4px solid;font-weight:500}
.alert.crit{background:var(--down-soft);border-color:var(--down)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--panel-2);border-color:var(--muted)}
.alert .tag{font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.alert.crit .tag{color:var(--down)} .alert.warn .tag{color:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:600 22px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.main .v{font-size:28px;color:var(--fg)}

section.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.blk-h h2{margin:0;font:700 18px/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.blk-h h2 .count{font:500 12px var(--f-mono);color:var(--muted);margin-left:6px}
.blk-h .side{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{padding:18px 14px;color:var(--muted);font-style:italic}
.coin{font-weight:700;font-family:var(--f-display)}
.acct{font:500 11px var(--f-mono);color:var(--muted)}
.pill{display:inline-block;font:700 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px}
.pill.long{background:var(--up-soft);color:var(--up)}
.pill.short{background:var(--down-soft);color:var(--down)}
.pill.neutral{background:var(--panel-2);color:var(--muted)}
.pill.crit{background:var(--down);color:var(--panel)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
tr.flag-crit td:first-child{box-shadow:inset 4px 0 var(--down)}
tr.flag-warn td:first-child{box-shadow:inset 4px 0 var(--warn)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 10px;font:600 12px var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.perf{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.perf{grid-template-columns:1fr}}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 8px 6px;min-width:0}
.chart-box svg{display:block;width:100%;height:auto}
.chart-box .axis{font:500 10.5px var(--f-mono);fill:var(--muted)}
.mini{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mini div{background:var(--panel);padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mini span:first-child{font-size:12px;color:var(--muted)}
.mini span:last-child{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats-grid div{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stats-grid .k{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats-grid .v{font:600 18px var(--f-mono);font-variant-numeric:tabular-nums}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;font:500 12px var(--f-mono);color:var(--muted)}
.loading{display:flex;gap:10px;align-items:center;padding:30px 0;color:var(--muted);font-family:var(--f-mono);font-size:13px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Hyperliquid · perp + spot</span>
      <h1 id="title">Hyperliquid</h1>
      <span class="addr" id="addrLine"></span>
    </div>
    <div class="toolbar">
      <span class="stamp" id="stamp">—</span>
      <button class="btn" id="btnSettings" type="button" aria-expanded="false">Réglages</button>
      <button class="btn primary" id="btnRefresh" type="button">Actualiser</button>
    </div>
  </header>

  <form id="settings" hidden>
    <label class="full">Adresse du wallet (0x…)
      <input id="inAddr" type="text" spellcheck="false" autocomplete="off">
    </label>
    <label>Nom affiché
      <input id="inName" type="text" autocomplete="off">
    </label>
    <label>Alerte liquidation : distance max (%)
      <input id="inLiq" type="number" min="0.1" step="0.5">
    </label>
    <label>Alerte ordre : distance max (%)
      <input id="inOrd" type="number" min="0.05" step="0.25">
    </label>
    <div class="row"><button class="btn primary" type="submit">Enregistrer et recharger</button></div>
  </form>

  <div id="alerts" aria-live="polite"></div>
  <div id="app"><div class="loading"><span class="spin"></span>Chargement des données Hyperliquid…</div></div>

  <footer>Données lues en direct sur l'API publique Hyperliquid (lecture seule, aucune clé requise). L'historique couvre les 10 000 dernières exécutions conservées par Hyperliquid.</footer>
</div>

<script>
"use strict";
/* ---------- Configuration ---------- */
const DEFAULTS = {
  address: "",
  name: "Mon wallet",
  liqPct: 10,
  ordPct: 2
};
const API = "https://api.hyperliquid.xyz/info";
const PAGE_SIZE = 50;

function loadCfg(){
  let c = {};
  try { c = JSON.parse(localStorage.getItem("hl-dash-cfg") || "{}") || {}; } catch(e){}
  return Object.assign({}, DEFAULTS, c);
}
function saveCfg(c){ try { localStorage.setItem("hl-dash-cfg", JSON.stringify(c)); } catch(e){} }
let CFG = loadCfg();

/* ---------- Formatage ---------- */
const nf = (d) => new Intl.NumberFormat("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d});
function usd(v, sign){
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const d = a !== 0 && a < 0.01 ? 4 : 2;
  const s = nf(d).format(a) + " $";
  if (v < 0) return "−" + s;
  return (sign && v > 0 ? "+" : "") + s;
}
function px(v){
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const d = a >= 1000 ? 1 : a >= 10 ? 2 : a >= 1 ? 4 : a >= 0.01 ? 5 : 7;
  return nf(d).format(v);
}
function qty(v){
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const d = a >= 1000 ? 2 : a >= 1 ? 4 : 6;
  return new Intl.NumberFormat("fr-FR",{maximumFractionDigits:d}).format(v);
}
function pct(v, sign){
  if (v == null || !isFinite(v)) return "—";
  return (sign && v > 0 ? "+" : v < 0 ? "−" : "") + nf(2).format(Math.abs(v)) + " %";
}
const cls = (v) => v > 0 ? "up" : v < 0 ? "down" : "";
const dtf = new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
const df = new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"short",year:"2-digit"});
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = (a) => a ? a.slice(0,6) + "…" + a.slice(-4) : "";

/* ---------- API ---------- */
async function info(body){
  const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error("API Hyperliquid : réponse " + r.status + " pour " + body.type);
  return r.json();
}
async function safe(p, fallback){ try { return await p; } catch(e){ console.warn(e); return fallback; } }

async function paginate(type, user, limit){
  const out = new Map();
  let start = 0;
  for (let i = 0; i < 40; i++){
    const batch = await info({type, user, startTime:start});
    if (!Array.isArray(batch) || !batch.length) break;
    let maxT = start;
    for (const x of batch){
      const key = type === "userFunding" ? (x.time + "|" + x.hash + "|" + (x.delta && x.delta.coin)) : (x.tid + "|" + x.hash);
      out.set(key, x);
      if (x.time > maxT) maxT = x.time;
    }
    if (batch.length < limit || maxT <= start) break;
    start = maxT;
  }
  return [...out.values()].sort((a,b) => a.time - b.time);
}

/* ---------- Chargement ---------- */
async function loadAll(addr){
  const user = addr.toLowerCase();
  const [spotMeta, mids, perpDexs, subs, vaults, staking, portfolio] = await Promise.all([
    info({type:"spotMeta"}),
    info({type:"allMids"}),
    safe(info({type:"perpDexs"}), [null]),
    safe(info({type:"subAccounts", user}), null),
    safe(info({type:"userVaultEquities", user}), []),
    safe(info({type:"delegatorSummary", user}), null),
    safe(info({type:"portfolio", user}), [])
  ]);

  const accounts = [{label:"Principal", user}];
  (subs || []).forEach(s => accounts.push({label:s.name || short(s.subAccountUser), user:s.subAccountUser.toLowerCase()}));
  const dexes = [""].concat((perpDexs || []).filter(d => d && d.name).map(d => d.name));

  // Positions perp (toutes les dex, tous les comptes)
  const perpStates = [];
  await Promise.all(accounts.flatMap(a => dexes.map(async dex => {
    const body = {type:"clearinghouseState", user:a.user};
    if (dex) body.dex = dex;
    const st = await safe(info(body), null);
    if (st) perpStates.push({acct:a, dex, st});
  })));

  // Mids des dex HIP-3 où une position existe
  const activeDexes = [...new Set(perpStates.filter(p => p.dex && (p.st.assetPositions || []).length).map(p => p.dex))];
  const dexMids = {};
  await Promise.all(activeDexes.map(async d => { dexMids[d] = await safe(info({type:"allMids", dex:d}), {}); }));
  const allMids = Object.assign({}, mids, ...Object.values(dexMids));

  // Spot, ordres, historique
  const per = await Promise.all(accounts.map(async a => {
    const orderDexes = [""].concat(activeDexes);
    const [spot, fills, funding, ...orders] = await Promise.all([
      safe(info({type:"spotClearinghouseState", user:a.user}), {balances:[]}),
      safe(paginate("userFillsByTime", a.user, 2000), []),
      safe(paginate("userFunding", a.user, 500), []),
      ...orderDexes.map(d => safe(info(d ? {type:"frontendOpenOrders", user:a.user, dex:d} : {type:"frontendOpenOrders", user:a.user}), []))
    ]);
    const seen = new Set(); const ords = [];
    orders.flat().forEach(o => { if (!seen.has(o.oid)) { seen.add(o.oid); ords.push(o); } });
    return {acct:a, spot, fills, funding, orders:ords};
  }));

  return {spotMeta, mids:allMids, perpStates, per, vaults:vaults || [], staking, portfolio:portfolio || [], accounts};
}

/* ---------- Spot : correspondances ---------- */
function spotMaps(meta){
  const tokByIdx = new Map((meta.tokens || []).map(t => [t.index, t]));
  const pairName = new Map(); // "@107" -> "HYPE"
  const tokenPairKey = new Map(); // tokenIndex -> clé allMids (paire contre USDC)
  (meta.universe || []).forEach(u => {
    const [b, q] = u.tokens || [];
    const bt = tokByIdx.get(b), qt = tokByIdx.get(q);
    const label = bt ? (qt && qt.name !== "USDC" ? bt.name + "/" + qt.name : bt.name) : u.name;
    pairName.set(u.name, label);
    if (q === 0 && !tokenPairKey.has(b)) tokenPairKey.set(b, u.name);
  });
  return {tokByIdx, pairName, tokenPairKey};
}
const isSpotCoin = (c) => c.startsWith("@") || c.includes("/");

/* ---------- Calculs ---------- */
function compute(d){
  const sm = spotMaps(d.spotMeta);
  const mid = (k) => { const v = parseFloat(d.mids[k]); return isFinite(v) ? v : null; };
  const coinLabel = (c) => isSpotCoin(c) ? (sm.pairName.get(c) || c) : c;
  const tokenPrice = (name, idx) => {
    if (name === "USDC" || name === "USDT0" || name === "USDH" || name === "USDE") return 1;
    const key = sm.tokenPairKey.get(idx);
    return key ? mid(key) : null;
  };
  const multi = d.accounts.length > 1;

  // Perp
  let perpValue = 0, upnl = 0, marginUsed = 0, withdrawable = 0;
  const positions = [];
  d.perpStates.forEach(({acct, dex, st}) => {
    const ms = st.marginSummary || {};
    perpValue += +ms.accountValue || 0;
    marginUsed += +ms.totalMarginUsed || 0;
    withdrawable += +st.withdrawable || 0;
    (st.assetPositions || []).forEach(ap => {
      const p = ap.position; const szi = +p.szi;
      if (!szi) return;
      const mark = Math.abs(+p.positionValue / szi) || mid(p.coin);
      const liq = p.liquidationPx != null ? +p.liquidationPx : null;
      const liqDist = liq && mark ? Math.abs(mark - liq) / mark * 100 : null;
      upnl += +p.unrealizedPnl || 0;
      positions.push({
        acct:acct.label, dex, coin:p.coin, side: szi > 0 ? "long" : "short", size:Math.abs(szi),
        entry:+p.entryPx, mark, value:+p.positionValue, upnl:+p.unrealizedPnl, roe:(+p.returnOnEquity || 0) * 100,
        lev:p.leverage ? p.leverage.value + "× " + (p.leverage.type === "cross" ? "cross" : "isolé") : "—",
        margin:+p.marginUsed, liq, liqDist, funding: p.cumFunding ? -(+p.cumFunding.sinceOpen) : null
      });
    });
  });
  positions.sort((a,b) => (a.liqDist ?? 1e9) - (b.liqDist ?? 1e9));

  // Spot
  let spotValue = 0, spotUpnl = 0;
  const spot = [];
  d.per.forEach(({acct, spot:s}) => (s.balances || []).forEach(b => {
    const total = +b.total; if (!total) return;
    const price = tokenPrice(b.coin, b.token);
    const value = price != null ? total * price : null;
    const cost = +b.entryNtl || 0;
    const pnl = value != null && cost && b.coin !== "USDC" ? value - cost : null;
    if (value != null) spotValue += value;
    if (pnl != null) spotUpnl += pnl;
    spot.push({acct:acct.label, coin:b.coin, total, hold:+b.hold, price, value, cost:b.coin === "USDC" ? null : cost, pnl});
  }));
  spot.sort((a,b) => (b.value || 0) - (a.value || 0));

  // Vaults & staking
  const vaultValue = d.vaults.reduce((s,v) => s + (+v.equity || 0), 0);
  let stakeHype = 0;
  if (d.staking) stakeHype = (+d.staking.delegated || 0) + (+d.staking.undelegated || 0) + (+d.staking.totalPendingWithdrawal || 0);
  const hypeTok = (d.spotMeta.tokens || []).find(t => t.name === "HYPE");
  const hypePx = hypeTok ? tokenPrice("HYPE", hypeTok.index) : null;
  const stakeValue = stakeHype && hypePx ? stakeHype * hypePx : 0;

  // Ordres
  const orders = [];
  d.per.forEach(({acct, orders:os}) => os.forEach(o => {
    const coin = o.coin; const m = mid(coin);
    const level = o.isTrigger && +o.triggerPx ? +o.triggerPx : +o.limitPx;
    const dist = m && level ? (level - m) / m * 100 : null;
    orders.push({acct:acct.label, coin:coinLabel(coin), spot:isSpotCoin(coin), side:o.side === "B" ? "achat" : "vente",
      type:o.orderType || (o.isTrigger ? "Trigger" : "Limit"), level, mid:m, dist, sz:+o.sz, origSz:+o.origSz,
      reduce:!!o.reduceOnly, cond:o.triggerCondition && o.triggerCondition !== "N/A" ? o.triggerCondition : "", time:o.timestamp});
  }));
  orders.sort((a,b) => Math.abs(a.dist ?? 1e9) - Math.abs(b.dist ?? 1e9));

  // Historique : regroupement des exécutions par ordre
  const groups = new Map();
  let fees = 0;
  d.per.forEach(({acct, fills}) => fills.forEach(f => {
    const k = acct.user + "|" + f.oid;
    let g = groups.get(k);
    if (!g){ g = {acct:acct.label, coin:coinLabel(f.coin), spot:isSpotCoin(f.coin), dir:f.dir, side:f.side, time:f.time, sz:0, ntl:0, fee:0, pnl:0, n:0}; groups.set(k,g); }
    const sz = +f.sz, p = +f.px, fee = +f.fee || 0;
    // frais payés en jeton non-USDC (achats spot) : conversion au prix d'exécution
    const feeUsd = f.feeToken && f.feeToken !== "USDC" && !f.feeToken.startsWith("USD") ? fee * p : fee;
    g.sz += sz; g.ntl += sz * p; g.fee += feeUsd; g.pnl += +f.closedPnl || 0; g.n++;
    if (f.time < g.time) g.time = f.time;
    fees += feeUsd;
  }));
  const trades = [...groups.values()].map(g => Object.assign(g, {px: g.sz ? g.ntl / g.sz : 0, net: g.pnl - g.fee}))
    .sort((a,b) => b.time - a.time);

  // Funding
  let fundIn = 0, fundOut = 0;
  const fundByCoin = {};
  d.per.forEach(({funding}) => funding.forEach(x => {
    const u = +(x.delta && x.delta.usdc) || 0; const c = x.delta && x.delta.coin;
    if (u >= 0) fundIn += u; else fundOut += u;
    fundByCoin[c] = (fundByCoin[c] || 0) + u;
  }));

  // Stats
  const closing = trades.filter(t => t.pnl !== 0);
  const wins = closing.filter(t => t.pnl > 0), losses = closing.filter(t => t.pnl < 0);
  const sumW = wins.reduce((s,t) => s + t.pnl, 0), sumL = losses.reduce((s,t) => s + t.pnl, 0);
  const realized = trades.reduce((s,t) => s + t.pnl, 0);
  const byCoin = {};
  trades.forEach(t => {
    const b = byCoin[t.coin] || (byCoin[t.coin] = {coin:t.coin, spot:t.spot, n:0, pnl:0, fee:0, vol:0, funding:0, wins:0, closes:0});
    b.n++; b.pnl += t.pnl; b.fee += t.fee; b.vol += t.ntl;
    if (t.pnl !== 0){ b.closes++; if (t.pnl > 0) b.wins++; }
  });
  Object.entries(fundByCoin).forEach(([c,u]) => {
    const b = byCoin[c] || (byCoin[c] = {coin:c, spot:false, n:0, pnl:0, fee:0, vol:0, funding:0, wins:0, closes:0});
    b.funding += u;
  });
  const coinRows = Object.values(byCoin).map(b => Object.assign(b, {net:b.pnl - b.fee + b.funding})).sort((a,b) => b.net - a.net);
  const firstTrade = trades.length ? trades[trades.length - 1].time : null;

  // Performance
  const perf = {};
  (d.portfolio || []).forEach(([k, v]) => { perf[k] = v; });

  // Alertes
  const alerts = [];
  positions.forEach(p => {
    if (p.liqDist != null && p.liqDist <= CFG.liqPct){
      alerts.push({lvl: p.liqDist <= CFG.liqPct / 2 ? "crit" : "warn", tag:"Liquidation",
        text:`${p.coin} ${p.side} : prix ${px(p.mark)}, liquidation à ${px(p.liq)}, soit ${pct(p.liqDist)} d'écart seulement${multi ? " (" + p.acct + ")" : ""}.`});
    }
  });
  orders.forEach(o => {
    if (o.dist != null && Math.abs(o.dist) <= CFG.ordPct){
      alerts.push({lvl:"warn", tag:"Ordre proche",
        text:`${o.side === "achat" ? "Achat" : "Vente"} ${o.coin} à ${px(o.level)} (${o.type}) — prix actuel ${px(o.mid)}, écart ${pct(Math.abs(o.dist))}${multi ? " (" + o.acct + ")" : ""}.`});
    }
  });

  return {
    total: perpValue + spotValue + vaultValue + stakeValue,
    perpValue, spotValue, vaultValue, stakeValue, stakeHype, upnl, spotUpnl, marginUsed, withdrawable,
    positions, spot, orders, trades, realized, fees, fundIn, fundOut,
    stats:{n:trades.length, closes:closing.length, wins:wins.length, losses:losses.length,
      winRate: closing.length ? wins.length / closing.length * 100 : null,
      avgW: wins.length ? sumW / wins.length : null, avgL: losses.length ? sumL / losses.length : null,
      pf: sumL ? sumW / Math.abs(sumL) : null,
      best: closing.length ? Math.max(...closing.map(t => t.pnl)) : null,
      worst: closing.length ? Math.min(...closing.map(t => t.pnl)) : null},
    coinRows, perf, alerts, multi, firstTrade, vaults:d.vaults
  };
}

/* ---------- Graphique ---------- */
function drawChart(series, mode){
  const pts = (series || []).map(([t,v]) => [+t, +v]).filter(p => isFinite(p[0]) && isFinite(p[1]));
  if (pts.length < 2) return `<div class="empty">Pas assez de points sur cette période.</div>`;
  const W = 760, H = 250, L = 70, R = 14, T = 14, B = 28;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (mode === "pnl"){ y0 = Math.min(y0, 0); y1 = Math.max(y1, 0); }
  if (y0 === y1){ y0 -= 1; y1 += 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  const X = t => L + (t - x0) / (x1 - x0 || 1) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const line = pts.map((p,i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const base = mode === "pnl" ? Y(0) : H - B;
  const area = line + ` L${X(x1).toFixed(1)} ${base.toFixed(1)} L${X(x0).toFixed(1)} ${base.toFixed(1)} Z`;
  const last = pts[pts.length - 1];
  const color = mode === "pnl" ? (last[1] >= 0 ? "var(--up)" : "var(--down)") : "var(--accent)";
  let grid = "";
  for (let i = 0; i <= 4; i++){
    const v = y0 + (y1 - y0) * i / 4; const y = Y(v);
    grid += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text class="axis" x="${L - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${esc(compactUsd(v))}</text>`;
  }
  for (let i = 0; i <= 3; i++){
    const t = x0 + (x1 - x0) * i / 3;
    const anchor = i === 0 ? "start" : i === 3 ? "end" : "middle";
    const lab = (x1 - x0) < 2 * 86400e3 ? new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit"}).format(t) : df.format(t);
    grid += `<text class="axis" x="${X(t).toFixed(1)}" y="${H - 8}" text-anchor="${anchor}">${esc(lab)}</text>`;
  }
  const zero = mode === "pnl" ? `<line x1="${L}" x2="${W - R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3"/>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe ${mode === "pnl" ? "du PnL" : "de la valeur du compte"}">
    ${grid}${zero}
    <path d="${area}" fill="${color}" fill-opacity="0.12" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="4" fill="${color}" stroke="var(--panel)" stroke-width="2"/>
  </svg>`;
}
function compactUsd(v){
  const a = Math.abs(v), s = v < 0 ? "−" : "";
  if (a >= 1e6) return s + nf(2).format(a / 1e6) + " M$";
  if (a >= 1e4) return s + nf(1).format(a / 1e3) + " k$";
  return s + nf(a < 10 ? 2 : 0).format(a) + " $";
}
function maxDrawdown(series){
  let peak = -Infinity, mdd = 0, mddPct = null;
  (series || []).forEach(([,v]) => {
    v = +v; if (!isFinite(v)) return;
    if (v > peak) peak = v;
    const dd = v - peak;
    if (dd < mdd){ mdd = dd; mddPct = peak > 0 ? dd / peak * 100 : null; }
  });
  return {abs:mdd, pct:mddPct};
}

      <div><span class="k">Perte moyenne</span><span class="v down">${usd(s.avgL, true)}</span></div>

      <div><span class="k">Meilleur trade</span><span class="v up">${usd(s.best, true)}</span></div>

    </div>
    <div class="tbl-wrap">${m.coinRows.length ? `<table><thead><tr><th>Actif</th><th>Marché</th><th class="r">Ordres</th><th class="r">Réussite</th><th class="r">Volume</th><th class="r">PnL réalisé</th><th class="r">Frais</th><th class="r">Funding</th><th class="r">Net</th></tr></thead><tbody>
      ${m.coinRows.map(b => `<tr><td><span class="coin">${esc(b.coin)}</span></td><td class="muted">${b.spot ? "spot" : "perp"}</td>
        <td class="num r">${b.n}</td><td class="num r">${b.closes ? pct(b.wins / b.closes * 100) : "—"}</td>
        <td class="num r">${usd(b.vol)}</td><td class="num r ${cls(b.pnl)}">${usd(b.pnl, true)}</td>
        <td class="num r down">${usd(-b.fee)}</td><td class="num r ${cls(b.funding)}">${b.funding ? usd(b.funding, true) : "—"}</td>
        <td class="num r ${cls(b.net)}"><strong>${usd(b.net, true)}</strong></td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">Aucun trade dans l'historique.</div>`}</div></section>`);

  // Historique
  parts.push(`<section class="blk" id="histBlk"></section>`);
  document.getElementById("app").innerHTML = `<div class="wrap" style="max-width:none">${parts.join("")}</div>`;
  renderHistory();
}

function renderHistory(){
  const m = M, h = STATE.hist;
  const coins = [...new Set(m.trades.map(t => t.coin))].sort();
  const fromT = h.from ? new Date(h.from + "T00:00:00").getTime() : -Infinity;
  const toT = h.to ? new Date(h.to + "T23:59:59").getTime() : Infinity;
  const rows = m.trades.filter(t =>
    (h.market === "all" || (h.market === "spot") === t.spot) &&
    (h.coin === "all" || t.coin === h.coin) && t.time >= fromT && t.time <= toT);
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if (h.page >= pages) h.page = pages - 1;
  const slice = rows.slice(h.page * PAGE_SIZE, (h.page + 1) * PAGE_SIZE);
  const sumNet = rows.reduce((s,t) => s + t.net, 0);
  const dirFr = (d) => ({ "Open Long":"Ouverture long", "Close Long":"Clôture long", "Open Short":"Ouverture short", "Close Short":"Clôture short",
    "Buy":"Achat", "Sell":"Vente", "Long > Short":"Long → short", "Short > Long":"Short → long", "Liquidated Isolated Long":"Liquidation long",
    "Liquidated Cross Long":"Liquidation long", "Liquidated Isolated Short":"Liquidation short", "Liquidated Cross Short":"Liquidation short" }[d] || d);
  const blk = document.getElementById("histBlk");
  blk.innerHTML = `<div class="blk-h"><h2>Historique des trades<span class="count">${rows.length}</span></h2><span class="side">Net filtré <strong class="num ${cls(sumNet)}">&nbsp;${usd(sumNet, true)}</strong></span></div>
    <div class="filters">
      <select id="fMarket" aria-label="Marché"><option value="all">Perp + spot</option><option value="perp">Perp</option><option value="spot">Spot</option></select>
      <select id="fCoin" aria-label="Actif"><option value="all">Tous les actifs</option>${coins.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
      <label class="muted" style="font-size:12px">Du <input id="fFrom" type="date" value="${esc(h.from)}"></label>
      <label class="muted" style="font-size:12px">au <input id="fTo" type="date" value="${esc(h.to)}"></label>
      <button class="btn" type="button" id="fReset">Effacer les filtres</button>
    </div>
    <div class="tbl-wrap">${slice.length ? `<table><thead><tr><th>Date</th><th>Actif</th><th>Opération</th><th class="r">Quantité</th><th class="r">Prix moyen</th><th class="r">Montant</th><th class="r">PnL réalisé</th><th class="r">Frais</th><th class="r">Net</th></tr></thead><tbody>
      ${slice.map(t => `<tr>
        <td class="num muted">${dtf.format(t.time)}</td>
        <td><span class="coin">${esc(t.coin)}</span>${m.multi ? `<div class="acct">${esc(t.acct)}</div>` : ""}</td>
        <td>${esc(dirFr(t.dir))}${t.spot ? ' <span class="pill neutral">spot</span>' : ""}</td>
        <td class="num r">${qty(t.sz)}</td><td class="num r">${px(t.px)}</td><td class="num r">${usd(t.ntl)}</td>
        <td class="num r ${cls(t.pnl)}">${t.pnl ? usd(t.pnl, true) : "—"}</td>
        <td class="num r muted">${usd(-t.fee)}</td>
        <td class="num r ${cls(t.net)}">${usd(t.net, true)}</td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">Aucun trade pour ces filtres.</div>`}</div>
    ${pages > 1 ? `<div class="pager"><button class="btn" type="button" id="pPrev" ${h.page === 0 ? "disabled" : ""}>Précédent</button><span>Page ${h.page + 1} / ${pages}</span><button class="btn" type="button" id="pNext" ${h.page >= pages - 1 ? "disabled" : ""}>Suivant</button></div>` : ""}`;
  document.getElementById("fMarket").value = h.market;
  document.getElementById("fCoin").value = coins.includes(h.coin) ? h.coin : "all";
}

/* ---------- Évènements ---------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || !M) return;
  if (b.dataset.period){ STATE.period = b.dataset.period; render(); }
  else if (b.dataset.mode){ STATE.mode = b.dataset.mode; render(); }
  else if (b.id === "pPrev"){ STATE.hist.page--; renderHistory(); }
  else if (b.id === "pNext"){ STATE.hist.page++; renderHistory(); }
  else if (b.id === "fReset"){ STATE.hist = {market:"all", coin:"all", from:"", to:"", page:0}; renderHistory(); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id, h = STATE.hist;
  if (!["fMarket","fCoin","fFrom","fTo"].includes(id)) return;
  if (id === "fMarket") h.market = e.target.value;
  if (id === "fCoin") h.coin = e.target.value;
  if (id === "fFrom") h.from = e.target.value;
  if (id === "fTo") h.to = e.target.value;
  h.page = 0; renderHistory();
});
document.getElementById("btnRefresh").addEventListener("click", () => run());
document.getElementById("btnSettings").addEventListener("click", (e) => {
  const f = document.getElementById("settings"); f.hidden = !f.hidden;
  e.currentTarget.setAttribute("aria-expanded", String(!f.hidden));
});
document.getElementById("settings").addEventListener("submit", (e) => {
  e.preventDefault();
  const addr = document.getElementById("inAddr").value.trim();
  if (!/^0x[0-9a-fA-F]{40}$/.test(addr)){ document.getElementById("inAddr").setCustomValidity("Adresse invalide : 0x suivi de 40 caractères hexadécimaux."); document.getElementById("inAddr").reportValidity(); return; }
  document.getElementById("inAddr").setCustomValidity("");
  CFG = {address:addr, name:document.getElementById("inName").value.trim() || "Wallet",
    liqPct:Math.max(0.1, +document.getElementById("inLiq").value || DEFAULTS.liqPct),
    ordPct:Math.max(0.05, +document.getElementById("inOrd").value || DEFAULTS.ordPct)};
  saveCfg(CFG); run();
});

function fillSettings(){
  document.getElementById("inAddr").value = CFG.address;
  document.getElementById("inName").value = CFG.name;
  document.getElementById("inLiq").value = CFG.liqPct;
  document.getElementById("inOrd").value = CFG.ordPct;
  document.getElementById("title").textContent = CFG.name;
  document.getElementById("addrLine").textContent = CFG.address;
  document.title = CFG.name + " Hyperliquid";
}

let running = false;
async function run(){
  if (running) return;
  fillSettings();
  if (!CFG.address){
    const f = document.getElementById("settings"); f.hidden = false;
    document.getElementById("btnSettings").setAttribute("aria-expanded","true");
    document.getElementById("addrLine").textContent = "Aucune adresse renseignée";
    document.getElementById("app").innerHTML = `<div class="alert info"><span class="tag">Bienvenue</span><span>Saisis l'adresse publique de ton wallet Hyperliquid (0x…) dans les réglages ci-dessus, puis clique sur « Enregistrer et recharger ». Elle reste enregistrée dans ce navigateur uniquement. Aucune clé privée n'est demandée.</span></div>`;
    document.getElementById("inAddr").focus();
    return;
  }
  running = true;
  const btn = document.getElementById("btnRefresh");
  btn.disabled = true; btn.textContent = "Chargement…";
  if (!M) document.getElementById("app").innerHTML = `<div class="loading"><span class="spin"></span>Chargement des positions, soldes et de l'historique complet…</div>`;
  try {
    const data = await loadAll(CFG.address);
    M = compute(data);
    renderAlerts(); render();
    document.getElementById("stamp").textContent = "Mis à jour " + new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(Date.now());
  } catch(err){
    console.error(err);
    document.getElementById("alerts").innerHTML = `<div class="alert crit" role="alert"><span class="tag">Erreur</span><span>Impossible de lire les données Hyperliquid (${esc(err.message || err)}). Vérifie ta connexion puis clique sur Actualiser.</span></div>`;
    if (!M) document.getElementById("app").innerHTML = "";
  } finally {
    btn.disabled = false; btn.textContent = "Actualiser"; running = false;
  }
}
run();
</script>
</body>
</html>
